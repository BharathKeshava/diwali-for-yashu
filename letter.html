<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>A Little Letter From My Heart 💌 · A Diwali Surprise</title>
  <meta name="description" content="Someone has written something special for you — sealed with love, opened only by you." />
  <meta name="theme-color" content="#120810" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500&family=Dancing+Script:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="letter" data-ambient="stars sparks bokeh">
  <div class="ambient" aria-hidden="true"></div>
  <div class="page-enter-veil" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to the story</a>

  <header id="site-header" class="site-header"></header>

  <main id="main" class="page">
    <section id="letter-scene" class="wrap center section" aria-labelledby="letter-title">
      <div class="eyebrow-flourish" data-reveal>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 20.5C7 16.5 3.5 13.2 3.5 9.6 3.5 7 5.5 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.6 0 3.6-3.5 6.9-8.5 10.9Z"/></svg>
      </div>
      <h2 id="letter-title" class="gold-text" data-text="letter.title" data-reveal>A Little Letter From My Heart 💌</h2>

      <div class="letter-teaser" data-reveal style="--reveal-delay:.15s">
        <p data-text="letter.teaser">Someone has written something special for you...</p>
        <small data-text="letter.teaserNote">Sealed with love, opened only by you</small>
        <button type="button" id="open-letter-btn" class="btn btn--heart" data-text="letter.button">Open My Letter 💌</button>
      </div>

      <div class="envelope-scene" data-reveal style="--reveal-delay:.25s">
        <div class="envelope" aria-hidden="true">
          <div class="env-body"></div>
          <div class="env-paper-peek"></div>
          <div class="env-flap"></div>
          <div class="env-seal">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 20.5C7 16.5 3.5 13.2 3.5 9.6 3.5 7 5.5 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.6 0 3.6-3.5 6.9-8.5 10.9Z"/></svg>
          </div>
        </div>
      </div>

      <!-- the letter itself, written live once the envelope opens -->
      <article id="letter-paper" class="letter-paper" hidden aria-label="The letter">
        <p class="letter-greeting"></p>
        <div class="letter-body"></div>
        <span class="type-caret" aria-hidden="true"></span>
        <div class="letter-sign" hidden>
          <span class="letter-sign-pre"></span>
          <span class="letter-sign-name"></span>
        </div>
        <button type="button" id="skip-typing" class="skip-type" data-text="letter.skipText">reveal it all at once</button>
      </article>
    </section>

    <div id="story-nav" class="story-nav wrap"></div>
  </main>

  <footer class="site-footer">
    <span class="script" data-text="footer.line">Made with all my heart, for my favourite person</span>
    <p class="site-footer__line"><span data-text="footer.signature">— Bharath</span> · <span data-year>2026</span></p>
  </footer>

  <nav id="bottom-nav" class="bottom-nav" aria-label="Chapters"></nav>

  <button type="button" id="music-toggle" class="music-btn" aria-pressed="false">
    <svg class="icon-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18.5V6l9-2v11.5" />
      <circle cx="6.5" cy="18.5" r="2.5" />
      <circle cx="15.5" cy="15.5" r="2.5" />
      <path d="m3.5 3.5 17 17" />
    </svg>
    <svg class="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18.5V6l9-2v11.5" />
      <circle cx="6.5" cy="18.5" r="2.5" />
      <circle cx="15.5" cy="15.5" r="2.5" />
    </svg>
  </button>

  <script src="js/content.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
